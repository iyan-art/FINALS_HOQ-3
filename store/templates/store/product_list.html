<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product List</title>
  </head>
  <body>
    <h1>Products</h1>

    <ul>
      {% for product in products %}
        <li>
          {{ product.name }} - ₱{{ product.price|floatformat:0 }}
        </li>
      {% empty %}
        <li>No products available.</li>
      {% endfor %}
    </ul>
  </body>
</html>
